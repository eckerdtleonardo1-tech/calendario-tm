<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gestión de pagos mensuales - Aplicación simple y funcional">
  <title>Gestión de Pagos Mensuales</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2.0">
</head>
<body>

  <header class="header">
    <h1>Pagos Mensuales</h1>
    <p>Registra y controla el estado de los pagos de cada mes</p>
  </header>

  <main class="months-grid" id="monthsGrid"></main>

  <header class="header player-section-header">
    <h1>Fichas de Jugadores</h1>
    <p>Registra nombre, posición y número de cada jugador</p>
  </header>
  
  <div class="player-form">
    <input type="text" id="p-name" placeholder="Nombre completo...">
    <input type="text" id="p-position" placeholder="Posición (ej. Delantero)...">
    <input type="number" id="p-number" placeholder="Dorsal (ej. 10)...">
    <button class="btn-add" id="btn-add-player">Agregar Jugador</button>
  </div>
  
  <div class="players-table-container">
    <table class="players-table">
      <thead>
        <tr>
          <th>Dorsal</th>
          <th>Nombre</th>
          <th>Posición</th>
          <th style="width: 50px;">Acción</th>
        </tr>
      </thead>
      <tbody id="playersTbody"></tbody>
    </table>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
